name: arXiv feed

# Paper Radar runs in a browser on a static site, and arXiv sends no CORS header
# on any of its endpoints, so the app itself is not allowed to read them. Here
# there is no browser and no such rule: fetch arXiv directly, commit the result,
# and let the site read it same-origin. No relay, no API key, no daily allowance.

on:
  schedule:
    - cron: '25 6 * * *'        # every morning, after arXiv's overnight announcement
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to fetch'
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: arxiv-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies: the script is plain node with fetch and a small parser.
      - name: Fetch arXiv
        run: node scripts/fetch-arxiv.mjs --days "${{ github.event.inputs.days || 7 }}"

      - name: Commit the feed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/arxiv
          if git diff --staged --quiet; then
            echo 'Nothing new from arXiv today.'
            exit 0
          fi
          git commit -m "arXiv feed: $(date -u +%Y-%m-%d)"
          git push

      # The site is served from gh-pages (npm run deploy → gh-pages -d build), so
      # the data has to land there too. Copying the files across is far cheaper
      # than rebuilding and redeploying the whole site once a day.
      - name: Publish the feed to the served branch
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo 'No gh-pages branch yet — run `npm run deploy` once; the feed rides along next time.'
            exit 0
          fi
          rm -rf /tmp/feed && mkdir -p /tmp/feed
          cp -r public/arxiv/. /tmp/feed/
          git fetch origin gh-pages --depth 1
          git checkout -B gh-pages origin/gh-pages
          mkdir -p arxiv
          rm -rf arxiv && mkdir -p arxiv
          cp -r /tmp/feed/. arxiv/
          git add arxiv
          if git diff --staged --quiet; then
            echo 'The served feed is already current.'
            exit 0
          fi
          git commit -m "arXiv feed: $(date -u +%Y-%m-%d)"
          git push origin gh-pages
